# OSSshelf Worker 配置（入库，作为唯一配置源）
#
# 覆盖范围：单个 Worker 同时承载前端静态资源（[assets]）与 API。
# 部署方式：GitHub Actions 执行 D1 迁移成功后 POST Deploy Hook，
#          由 Workers Builds 执行 `pnpm build:web` 与 `wrangler deploy`。
#
# D1 / KV 的 id 属于资源标识（非密钥），直接写死在仓库里；
# 密钥（JWT_SECRET / ALERT_TG_BOT_TOKEN / CF_API_TOKEN）不在此文件，
# 由 Cloudflare Dashboard 的 Worker Secrets 手工维护。
#
# 禁止改 name：改名会重建 Durable Object 命名空间，已有会话数据会失联。
name = "ossshelf-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
# 生产环境上传 sourcemap，便于在 Cloudflare 控制台还原堆栈
upload_source_maps = true

# ── 前端静态资源（apps/web 构建产物，由同一 Worker 承载）─────────────────
# run_worker_first 必须显式列出后端路径，否则浏览器直接访问 /api/... 时
# 会被 SPA 回退成 index.html；/agents 是 DO WebSocket，/dav 是 WebDAV。
# 同时列出裸路径与通配符：/api/* 不匹配 /api 本身。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/dav", "/dav/*", "/agents", "/agents/*", "/cron", "/cron/*", "/health"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "ossshelf-files"

# ── Agent Durable Object ─────────────────────────────────────────────────
# 每个会话一个 DO，承载消息持久化与可恢复流式推理。
# migrations tag 一旦上线不可修改或复用，新增类请追加新 tag。
[[durable_objects.bindings]]
name = "OSSShelfAgent"
class_name = "OSSShelfAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OSSShelfAgent"]

[[d1_databases]]
binding = "DB"
database_name = "ossshelf-db"
database_id = "2482319e-1ac1-439b-a668-a291bd9646f6"

# ── R2 直连绑定（可选 / 历史遗留）─────────────────────────────────────────
# 存储桶现由应用内「存储桶管理」配置（R2 / AWS S3 / 阿里云 OSS 等 S3 兼容服务）。
# 仅当需要继续访问多桶改造前上传的旧文件时才解注释；解注释前需确认
# bucket 已存在，否则 `wrangler deploy` 会因绑定解析失败而中止。
#
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "ossshelf-files"

[[kv_namespaces]]
binding = "KV"
id = "e1fbbca4d1324c0ca61587ed897d5077"

# ── AI 批处理队列 ───────────────────────────────────────────────────────
# 每个消息处理一个文件，避免单个 Worker 超时。
[[queues.producers]]
queue = "ossshelf-ai-tasks"
binding = "AI_TASKS_QUEUE"

[[queues.consumers]]
queue = "ossshelf-ai-tasks"
max_batch_size = 1
max_batch_timeout = 5
# Vectorize 写入存在限流窗口，重试次数需覆盖数分钟的窗口
max_retries = 6
retry_delay = 60
max_concurrency = 10

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[vars]
ENVIRONMENT = "production"
# 同源部署时可留空：未配置时直链按请求 Origin 生成，结果一致。
# 若使用独立直链域名，请填入该域名。
PUBLIC_URL = ""
# 同源部署不需要 CORS；仅外部域名/客户端跨域调用时才填，多个用逗号分隔。
CORS_ORIGINS = ""
TRASH_RETENTION_DAYS = "30"

# ── Cron 告警（可选）──────────────────────────────────────────────────────
# 需同时具备 Worker Secret ALERT_TG_BOT_TOKEN 与这里的 Chat ID，才会发送告警。
# 从 Dashboard 获取 Chat ID 后填入（例如 -100xxxxxxxxxx），留空则关闭告警。
ALERT_TG_CHAT_ID = ""
# Workers AI 实时模型目录需要账户 ID（可选）
CF_ACCOUNT_ID = ""

# ── Cron Triggers (定时任务) ─────────────────────────────────────────────
# 每天凌晨 3 点执行回收站清理
[triggers]
crons = ["0 3 * * *"]
