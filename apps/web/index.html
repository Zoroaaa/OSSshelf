<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta
      name="description"
      content="OSSshelf - 基于 Cloudflare 部署的多厂商 OSS 文件管理系统，支持 WebDAV、预签名直传、安全分享"
    />
    <meta name="keywords" content="OSS, 文件管理, 云存储, WebDAV, S3, Cloudflare" />
    <meta name="author" content="OSSshelf" />

    <!-- PWA Meta Tags -->
    <!-- 只保留一个 theme-color，由主题 store 动态更新；不再用 media 查询跟随系统，
         否则用户手动切深色时状态栏配色不会跟着变。 -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OSSshelf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="OSSshelf" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to API -->
    <link rel="preconnect" href="/api" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="/api" />

    <title>OSSshelf - 文件管理系统</title>

    <!-- B-05 修复：首屏主题前置脚本。在样式与应用 JS 执行前读取持久化主题，
         提前设置 html.dark，避免"系统偏好 → 用户偏好"的明暗跳变。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ossshelf-theme');
          var theme = 'system';
          if (saved) {
            var parsed = JSON.parse(saved);
            theme = (parsed && parsed.state && parsed.state.theme) || 'system';
          }
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
          if (effective === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          /* 读取失败时回退到系统偏好 */
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>

    <!-- Inline Critical CSS：仅用于首屏无样式阶段的底色，变量格式必须与应用一致（HSL 三元组），
         否则 hsl(var(--x)) 会解析失败导致透明/闪白。 -->
    <style>
      :root {
        color-scheme: light;
        --primary: 221.2 83.2% 53.3%;
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
      }

      /* 主题以 html.dark 为准（与前置脚本一致），不再单纯依赖系统偏好 */
      html.dark {
        color-scheme: dark;
        --primary: 217.2 91.2% 59.8%;
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Loading spinner */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .app-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: hsl(var(--primary));
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Safe area padding for iOS */
      @supports (padding: max(0px)) {
        body {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker 注册统一在 src/main.tsx 中处理（生产环境才注册），
         避免此处与入口文件重复注册，也避免开发环境被旧缓存接管。 -->
  </body>
</html>
