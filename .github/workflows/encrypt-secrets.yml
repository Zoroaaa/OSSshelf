name: Encrypt plaintext AI keys

# 仅手动触发：把 ai_providers.api_key_encrypted 中的历史明文密钥用 AES-GCM 重新加密。
# 说明文档：docs/runbooks/encrypt-plaintext-secrets.md
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run=只读检测不写库(默认)；migrate=正式加密写库；rollback=用备份还原'
        type: choice
        options:
          - dry-run
          - migrate
          - rollback
        default: dry-run
      backup_file:
        description: '仅 rollback 需要：apps/api/backups/ai-provider-keys-<时间戳>.json'
        type: string
        required: false
        default: ''
      confirm:
        description: 'migrate / rollback 必须勾选，确认要写生产库'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: encrypt-plaintext-secrets
  cancel-in-progress: false

jobs:
  encrypt:
    runs-on: ubuntu-latest
    # 首次使用会自动创建同名 Environment；建议在仓库 Settings → Environments
    # 为其配置 Required reviewers，让正式执行多一道人工确认。
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.toml
        # 脚本在 apps/api 下执行，必须让 wrangler 在该目录找到配置
        working-directory: apps/api
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cat > wrangler.toml <<EOF
          name = "ossshelf"
          main = "src/index.ts"
          compatibility_date = "2026-05-01"
          compatibility_flags = ["nodejs_compat"]

          [[d1_databases]]
          binding = "DB"
          database_name = "ossshelf-db"
          database_id = "${D1_ID}"
          EOF

      - name: Run migration script
        working-directory: apps/api
        env:
          # 密钥只通过 env 注入：不写命令行参数、不 echo、不开 set -x
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
          BACKUP: ${{ inputs.backup_file }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          echo "mode=$MODE"

          if [ "$MODE" != "dry-run" ] && [ "$CONFIRM" != "true" ]; then
            echo "::error::mode=$MODE 会写生产库，请勾选 confirm 后重试"
            exit 1
          fi

          case "$MODE" in
            dry-run)
              node scripts/encrypt-plaintext-secrets.mjs --remote --dry-run
              ;;
            migrate)
              node scripts/encrypt-plaintext-secrets.mjs --remote
              ;;
            rollback)
              if [ -z "$BACKUP" ]; then
                echo "::error::rollback 需要填写 backup_file"
                exit 1
              fi
              node scripts/encrypt-plaintext-secrets.mjs --remote --rollback "$BACKUP"
              ;;
            *)
              echo "::error::未知 mode: $MODE"
              exit 1
              ;;
          esac

      - name: Upload backup and SQL
        # 备份 JSON 含明文密钥：仅保留 1 天，下载后请立即删除
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-migration-output
          path: |
            apps/api/backups/
            apps/api/encrypt-keys-*.sql
            apps/api/rollback-*.sql
          retention-days: 1
          if-no-files-found: ignore
