name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @osshelf/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Create Vectorize index
        run: |
          echo "Checking if Vectorize index exists..."
          if ! npx wrangler vectorize list 2>/dev/null | grep -q "ossshelf-files"; then
            echo "Creating Vectorize index..."
            npx wrangler vectorize create ossshelf-files --dimensions=1024 --metric=cosine
          else
            echo "Vectorize index already exists, skipping creation"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create AI Tasks Queue
        run: |
          echo "Checking if AI Tasks Queue exists..."
          if ! npx wrangler queues list 2>/dev/null | grep -q "ossshelf-ai-tasks"; then
            echo "Creating AI Tasks Queue..."
            npx wrangler queues create ossshelf-ai-tasks
          else
            echo "AI Tasks Queue already exists, skipping creation"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate wrangler.toml
        run: |
          cat > apps/api/wrangler.toml << EOF
          name = "ossshelf-api"
          main = "src/index.ts"
          compatibility_date = "2026-05-01"
          compatibility_flags = ["nodejs_compat"]

          [ai]
          binding = "AI"

          [[vectorize]]
          binding = "VECTORIZE"
          index_name = "ossshelf-files"

          [[durable_objects.bindings]]
          name = "OSSShelfAgent"
          class_name = "OSSShelfAgent"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["OSSShelfAgent"]

          [[d1_databases]]
          binding = "DB"
          database_name = "ossshelf-db"
          database_id = "${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}"

          [[kv_namespaces]]
          binding = "KV"
          id = "${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}"

          [[queues.producers]]
          queue = "ossshelf-ai-tasks"
          binding = "AI_TASKS_QUEUE"

          [[queues.consumers]]
          queue = "ossshelf-ai-tasks"
          max_batch_size = 1
          max_batch_timeout = 5
          max_retries = 6
          retry_delay = 60
          max_concurrency = 10

          [observability]
          enabled = false
          head_sampling_rate = 1

          [observability.logs]
          enabled = true
          head_sampling_rate = 1
          persist = true
          invocation_logs = true

          [vars]
          ENVIRONMENT = "production"
          JWT_SECRET = "${{ secrets.JWT_SECRET }}"
          PUBLIC_URL = "${{ secrets.PUBLIC_URL }}"
          CORS_ORIGINS = "${{ secrets.CORS_ORIGINS }}"
          TRASH_RETENTION_DAYS = "${{ secrets.TRASH_RETENTION_DAYS || '30' }}"
          ALERT_TG_BOT_TOKEN = "${{ secrets.ALERT_TG_BOT_TOKEN }}"
          ALERT_TG_CHAT_ID = "${{ secrets.ALERT_TG_CHAT_ID }}"
          CF_ACCOUNT_ID = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_API_TOKEN = "${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}"

          [triggers]
          crons = ["0 3 * * *"]
          EOF

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
