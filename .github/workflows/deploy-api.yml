name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      # 前端产物由同一个 Worker 承载，纯前端改动也必须走完迁移预检 → Hook → 部署
      - 'apps/web/**'
      - 'packages/shared/**'
      # wrangler.toml 由脚本生成，改脚本等于改部署配置
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @osshelf/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Vectorize 索引与 AI 队列属于一次性资源，已在控制台/首次部署时创建，
      # 不再每次运行都做幂等检查（见 docs/deployment.md「首次部署」）。
      - name: Generate wrangler.toml
        # 与 Workers Builds 共用 scripts/generate-wrangler.mjs，避免两处配置漂移。
        # 该配置包含 [assets]，前端构建产物 apps/web/dist 由同一 Worker 承载。
        run: node scripts/generate-wrangler.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          ENVIRONMENT: production
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          TRASH_RETENTION_DAYS: ${{ secrets.TRASH_RETENTION_DAYS || '30' }}
          ALERT_TG_CHAT_ID: ${{ secrets.ALERT_TG_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preflight D1 migration state
        # 比对 d1_migrations 与真实 schema，拦截“控制台手工执行过但未记录”等会直接失败的差异。
        # 修复指引：docs/runbooks/d1-112-repair.md
        working-directory: apps/api
        run: node scripts/preflight-migrations.mjs --db ossshelf-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        # 以 SQL 迁移为唯一事实源：部署前先应用未执行的迁移，避免代码先于表结构上线
        run: npx wrangler d1 migrations apply ossshelf-db --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets（JWT_SECRET / ALERT_TG_BOT_TOKEN / CF_API_TOKEN）跨部署持久存在，
      # 只在首次部署或轮换时手工执行 `wrangler secret put`，不再每次流水线重写。
      - name: Trigger Workers Builds deploy
        # 顺序保证：迁移成功后，才通过 Deploy Hook 触发构建部署。
        # Workers Builds 侧的推送构建必须用「监视路径不命中」挡掉，否则 push
        # 会与这里的迁移并发抢跑，新代码可能跑在旧 schema 上。
        env:
          CF_BUILDS_DEPLOY_HOOK: ${{ secrets.CF_BUILDS_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_BUILDS_DEPLOY_HOOK" ]; then
            echo "::error::缺少 secrets.CF_BUILDS_DEPLOY_HOOK，无法触发部署（迁移已应用，代码未更新）"
            exit 1
          fi
          curl -fsS -X POST "$CF_BUILDS_DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -w "\nWorkers Builds deploy triggered: HTTP %{http_code}\n"
