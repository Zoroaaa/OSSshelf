name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @osshelf/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Create Vectorize index
        run: |
          echo "Checking if Vectorize index exists..."
          if ! npx wrangler vectorize list 2>/dev/null | grep -q "ossshelf-files"; then
            echo "Creating Vectorize index..."
            npx wrangler vectorize create ossshelf-files --dimensions=1024 --metric=cosine
          else
            echo "Vectorize index already exists, skipping creation"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create AI Tasks Queue
        run: |
          echo "Checking if AI Tasks Queue exists..."
          if ! npx wrangler queues list 2>/dev/null | grep -q "ossshelf-ai-tasks"; then
            echo "Creating AI Tasks Queue..."
            npx wrangler queues create ossshelf-ai-tasks
          else
            echo "AI Tasks Queue already exists, skipping creation"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate wrangler.toml
        # 与 Workers Builds 共用 scripts/generate-wrangler.mjs，避免两处配置漂移。
        # 该配置包含 [assets]，前端构建产物 apps/web/dist 由同一 Worker 承载。
        run: node scripts/generate-wrangler.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          ENVIRONMENT: production
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          TRASH_RETENTION_DAYS: ${{ secrets.TRASH_RETENTION_DAYS || '30' }}
          ALERT_TG_CHAT_ID: ${{ secrets.ALERT_TG_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preflight D1 migration state
        # 比对 d1_migrations 与真实 schema，拦截“控制台手工执行过但未记录”等会直接失败的差异。
        # 修复指引：docs/runbooks/d1-112-repair.md
        working-directory: apps/api
        run: node scripts/preflight-migrations.mjs --db ossshelf-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        # 以 SQL 迁移为唯一事实源：部署前先应用未执行的迁移，避免代码先于表结构上线
        run: npx wrangler d1 migrations apply ossshelf-db --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Trigger Workers Builds deploy
        # 顺序保证：迁移成功后，才通过 Deploy Hook 触发 Workers Builds 构建部署。
        # Workers Builds 侧必须关闭 main 分支的自动部署，否则 push 会与这里的
        # 迁移并发抢跑，新代码可能跑在旧 schema 上。
        env:
          CF_BUILDS_DEPLOY_HOOK: ${{ secrets.CF_BUILDS_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_BUILDS_DEPLOY_HOOK" ]; then
            echo "::error::缺少 secrets.CF_BUILDS_DEPLOY_HOOK，无法触发部署（迁移已应用，代码未更新）"
            exit 1
          fi
          curl -fsS -X POST "$CF_BUILDS_DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -w "\nWorkers Builds deploy triggered: HTTP %{http_code}\n"

      - name: Configure Worker secrets
        # 必须指定 working-directory，否则 wrangler 在仓库根目录找不到
        # apps/api/wrangler.toml，会报 "Required Worker name missing"。
        # 放在 deploy 之后：首次部署时 Worker 尚不存在，secret put 会失败。
        working-directory: apps/api
        run: |
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
          if [ -n "${{ secrets.ALERT_TG_BOT_TOKEN }}" ]; then
            echo "${{ secrets.ALERT_TG_BOT_TOKEN }}" | npx wrangler secret put ALERT_TG_BOT_TOKEN
          fi
          # CF_API_TOKEN 是 Cloudflare API 令牌，禁止写入明文 [vars]
          if [ -n "${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}" | npx wrangler secret put CF_API_TOKEN
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
